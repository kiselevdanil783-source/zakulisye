<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ЗАКУЛИСЬЕ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:'Courier New',monospace;color:#e8dfae;user-select:none}
  canvas{display:block}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 100%)}
  #tint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s ease;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%)}
  #heat{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease;mix-blend-mode:screen;
    background:radial-gradient(ellipse at center, rgba(255,90,0,0) 30%, rgba(200,50,0,.6) 100%)}
  #blackout{position:fixed;inset:0;pointer-events:none;opacity:0;background:#000;transition:opacity .25s ease}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center, rgba(180,0,0,0) 30%, rgba(140,0,0,.75) 100%);
    transition:opacity .3s}
  #trap{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;transition:opacity .2s}
  #hud{position:fixed;top:14px;left:16px;font-size:14px;letter-spacing:2px;
    text-shadow:0 0 10px #000, 0 0 3px #000;opacity:.9;pointer-events:none;line-height:1.7}
  #hud b{color:#f2e49a}
  #meterbar{position:fixed;bottom:20px;left:16px;width:200px;pointer-events:none;
    font-size:12px;letter-spacing:1.5px;opacity:.85}
  #meterbar .fill{height:6px;background:#3a3320;margin-top:4px;overflow:hidden;border:1px solid #6a5e30}
  #meterbar .fill i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#8b7a3d,#e0c55c,#e0843c);transition:width .3s}
  #toast{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:clamp(20px,4.5vw,40px);
    letter-spacing:8px;color:#f4e9a8;text-shadow:0 0 30px rgba(255,230,140,.7),0 0 6px #000;
    opacity:0;transition:opacity .5s;pointer-events:none;z-index:8;padding:0 20px}
  #hint{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
    font-size:13px;letter-spacing:3px;color:#c9b96a;text-shadow:0 0 10px #000;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:7;
    background:rgba(0,0,0,.55);padding:6px 14px;border:1px solid #6a5e30}
  #hint.on{opacity:1}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px;cursor:pointer;z-index:10;
    background:radial-gradient(ellipse at center,#191509 0%, #050402 100%);overflow-y:auto}
  #overlay.hidden{display:none}
  #overlay h1{font-size:clamp(30px,8vw,74px);letter-spacing:14px;color:#e9da8c;
    text-shadow:0 0 40px rgba(230,210,120,.45);margin-bottom:10px}
  #overlay h2{font-size:clamp(16px,4vw,28px);letter-spacing:8px;color:#d9c98c;margin-bottom:16px}
  #overlay .sub{font-size:14px;letter-spacing:6px;color:#a1955f;margin-bottom:22px}
  #overlay p{max-width:640px;line-height:1.75;color:#a1955f;font-size:15px;margin-bottom:12px}
  #overlay b{color:#e9da8c}
  #overlay .doc{max-width:640px;text-align:left;font-size:13px;line-height:1.7;
    color:#8b8055;border-left:2px solid #4a4120;padding-left:14px;margin:14px 0}
  #overlay .keys{margin-top:18px;color:#7d734f;font-size:13px;letter-spacing:1px}
  #overlay .hint{margin-top:24px;color:#e9da8c;letter-spacing:5px;font-size:14px;
    animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="tint"></div>
<div id="heat"></div>
<div id="blackout"></div>
<div id="dmg"></div>
<div id="trap"></div>
<div id="toast"></div>
<div id="hint"></div>

<div id="hud">
  <div>УРОВЕНЬ: <b id="hLevel">0</b></div>
  <div>ВРЕМЯ: <b id="hTime">0:00</b></div>
  <div>ПОПЫТОК: <b id="hDeaths">0</b></div>
</div>

<div id="meterbar">
  <div><span id="mLabel">CO₂</span>: <span id="mVal">0.04%</span></div>
  <div class="fill"><i id="mFill"></i></div>
</div>

<div id="overlay"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============ КОНСТАНТЫ ============ */
const CELL=4, WALL_H=3.2, W=25, H=25, PR=0.38;
const CO2_RATE=0.0011, MUTATE_EVERY=70, MANILA_CHANCE=0.28;

/* ============ DOM ============ */
const $=id=>document.getElementById(id);
const canvas=$('c'), overlay=$('overlay'), toastEl=$('toast'), hintEl=$('hint');
const tintEl=$('tint'), heatEl=$('heat'), blackoutEl=$('blackout'), dmgEl=$('dmg'), trapEl=$('trap');
const hLevel=$('hLevel'), hTime=$('hTime'), hDeaths=$('hDeaths');
const mLabel=$('mLabel'), mVal=$('mVal'), mFill=$('mFill');

/* ============ RENDERER ============ */
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
const MAX_ANISO=renderer.capabilities.getMaxAnisotropy();

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x59523a);
scene.fog=new THREE.Fog(0x59523a, 5, 33);

const camera=new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.05, 200);
camera.rotation.order='YXZ';

/* ============ ТЕКСТУРЫ ============ */
function cv(S){const c=document.createElement('canvas');c.width=c.height=S;return c;}
function fin(c,rep=1){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rep,rep);
  t.anisotropy=MAX_ANISO;
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function noise(g,S,amp){
  const id=g.getImageData(0,0,S,S),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(Math.random()-0.5)*amp;d[i]+=n;d[i+1]+=n;d[i+2]+=n*0.95;}
  g.putImageData(id,0,0);
}

function makeWallpaper(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#c9b26b';g.fillRect(0,0,S,S);
  for(let x=0;x<S;x+=64){
    g.fillStyle='rgba(110,92,40,0.13)';g.fillRect(x,0,32,S);
    g.fillStyle='rgba(255,244,190,0.05)';g.fillRect(x+32,0,32,S);
  }
  noise(g,S,24);
  for(let i=0;i<28;i++){
    const x=Math.random()*S,y=Math.random()*S,r=25+Math.random()*95;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(88,70,20,0.14)');gr.addColorStop(1,'rgba(88,70,20,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  const gr2=g.createLinearGradient(0,S*0.66,0,S);
  gr2.addColorStop(0,'rgba(0,0,0,0)');gr2.addColorStop(1,'rgba(25,18,2,0.52)');
  g.fillStyle=gr2;g.fillRect(0,S*0.66,S,S*0.34);
  return c;
}
function makeCarpet(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#6d5f34';g.fillRect(0,0,S,S);
  noise(g,S,42);
  for(let i=0;i<110;i++){
    const x=Math.random()*S,y=Math.random()*S,r=12+Math.random()*70;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(35,28,8,0.20)');gr.addColorStop(1,'rgba(35,28,8,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<2600;i++){
    g.fillStyle=Math.random()<0.5?'rgba(255,240,180,0.045)':'rgba(20,15,0,0.06)';
    g.fillRect(Math.random()*S,Math.random()*S,1.6,1.6);
  }
  return c;
}
function makeCeilTile(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#b6b096';g.fillRect(0,0,S,S);
  noise(g,S,18);
  g.strokeStyle='rgba(70,64,44,0.65)';g.lineWidth=8;g.strokeRect(4,4,S-8,S-8);
  g.strokeStyle='rgba(150,143,110,0.35)';g.lineWidth=3;g.strokeRect(14,14,S-28,S-28);
  for(let y=0;y<S;y+=18)for(let x=0;x<S;x+=18){
    g.fillStyle='rgba(80,74,52,0.16)';
    g.beginPath();g.arc(x+9,y+9,1.7,0,Math.PI*2);g.fill();
  }
  return c;
}
function makeConcreteWall(tint,block){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle=tint;g.fillRect(0,0,S,S);
  if(block){
    for(let y=0;y<S;y+=64)for(let x=0;x<S;x+=128){
      const off=(y/64)%2===0?0:64;
      g.strokeStyle='rgba(90,90,85,0.55)';g.lineWidth=3;g.strokeRect(x+off,y,128,64);
      g.fillStyle='rgba(180,180,175,0.18)';g.fillRect(x+off+2,y+2,124,60);
    }
  }
  noise(g,S,22);
  for(let i=0;i<24;i++){
    const x=Math.random()*S,y=Math.random()*S*0.5,len=40+Math.random()*140;
    const gr=g.createLinearGradient(x,y,x,y+len);
    gr.addColorStop(0,'rgba(60,58,50,0.22)');gr.addColorStop(1,'rgba(60,58,50,0)');
    g.fillStyle=gr;g.fillRect(x-2,y,4+Math.random()*4,len);
  }
  g.strokeStyle='rgba(40,38,32,0.5)';g.lineWidth=1.5;
  for(let i=0;i<6;i++){
    g.beginPath();let x=Math.random()*S,y=Math.random()*S;g.moveTo(x,y);
    for(let k=0;k<12;k++){x+=(Math.random()-0.5)*40;y+=(Math.random()-0.5)*40;g.lineTo(x,y);}
    g.stroke();
  }
  const gr2=g.createLinearGradient(0,S*0.75,0,S);
  gr2.addColorStop(0,'rgba(0,0,0,0)');gr2.addColorStop(1,'rgba(30,28,22,0.5)');
  g.fillStyle=gr2;g.fillRect(0,S*0.75,S,S*0.25);
  return c;
}
function makeConcreteFloor(tint){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle=tint;g.fillRect(0,0,S,S);
  noise(g,S,50);
  g.strokeStyle='rgba(40,38,32,0.55)';g.lineWidth=2;
  for(let i=0;i<4;i++){
    g.beginPath();let x=Math.random()*S,y=Math.random()*S;g.moveTo(x,y);
    for(let k=0;k<14;k++){x+=(Math.random()-0.5)*55;y+=(Math.random()-0.5)*55;g.lineTo(x,y);}
    g.stroke();
  }
  for(let i=0;i<22;i++){
    const x=Math.random()*S,y=Math.random()*S,r=20+Math.random()*90;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(30,30,28,0.42)');
    gr.addColorStop(0.7,'rgba(45,45,42,0.22)');
    gr.addColorStop(1,'rgba(45,45,42,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  return c;
}
function makeIndustrialCeil(tint){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle=tint;g.fillRect(0,0,S,S);
  noise(g,S,30);
  g.strokeStyle='rgba(30,28,24,0.7)';g.lineWidth=5;
  for(let x=0;x<S;x+=128){g.beginPath();g.moveTo(x,0);g.lineTo(x,S);g.stroke();}
  g.strokeStyle='rgba(30,28,24,0.4)';g.lineWidth=3;
  for(let y=0;y<S;y+=128){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
  return c;
}
function makeCrateTex(){
  const S=256,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#8a6a3c';g.fillRect(0,0,S,S);
  noise(g,S,30);
  g.strokeStyle='rgba(50,32,12,0.7)';g.lineWidth=3;
  for(let y=0;y<S;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
  g.fillStyle='rgba(70,70,72,0.85)';
  g.fillRect(0,0,S,12);g.fillRect(0,S-12,S,12);g.fillRect(0,0,12,S);g.fillRect(S-12,0,12,S);
  g.fillStyle='rgba(20,15,5,0.5)';
  g.font='bold 34px monospace';g.textAlign='center';
  g.fillText('СНАБ',S/2,S/2+12);
  return c;
}
function makeDrawingTex(){
  const S=256,c=cv(S),g=c.getContext('2d');
  g.clearRect(0,0,S,S);
  g.strokeStyle='rgba(15,10,5,0.85)';g.lineWidth=3;
  const kind=(Math.random()*4)|0;
  if(kind===0){
    g.beginPath();g.arc(S/2,60,22,0,Math.PI*2);g.stroke();
    g.beginPath();
    g.moveTo(S/2,82);g.lineTo(S/2,170);
    g.moveTo(S/2,110);g.lineTo(S/2-45,145);
    g.moveTo(S/2,110);g.lineTo(S/2+45,145);
    g.moveTo(S/2,170);g.lineTo(S/2-30,220);
    g.moveTo(S/2,170);g.lineTo(S/2+30,220);
    g.stroke();
  }else if(kind===1){
    for(let i=0;i<5;i++){
      const a=Math.random()*Math.PI*2;
      const x1=S/2+Math.cos(a)*30,y1=S/2+Math.sin(a)*30;
      const x2=S/2+Math.cos(a)*95,y2=S/2+Math.sin(a)*95;
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    }
  }else if(kind===2){
    g.beginPath();
    for(let t=0;t<Math.PI*8;t+=0.1){
      const r=4+t*3.2;
      const x=S/2+Math.cos(t)*r,y=S/2+Math.sin(t)*r;
      if(t===0)g.moveTo(x,y);else g.lineTo(x,y);
    }
    g.stroke();
  }else{
    g.fillStyle='rgba(15,10,5,0.85)';
    g.font='bold 26px monospace';g.textAlign='center';
    g.fillText('ХУДОЖНИК',S/2,80);g.fillText('УМИРАЕТ',S/2,120);
    g.fillText('ВО МНЕ',S/2,160);
    g.font='italic 18px monospace';g.fillText('=)',S/2,210);
  }
  return c;
}
function makeVentTex(){
  const S=256,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#2b2926';g.fillRect(0,0,S,S);
  g.strokeStyle='rgba(120,118,110,0.65)';g.lineWidth=4;
  for(let y=8;y<S;y+=20){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
  g.strokeStyle='rgba(60,58,52,0.9)';g.lineWidth=6;g.strokeRect(6,6,S-12,S-12);
  const gr=g.createLinearGradient(0,0,0,S*0.6);
  gr.addColorStop(0,'rgba(0,0,0,0.9)');
  gr.addColorStop(0.6,'rgba(10,8,6,0.5)');
  gr.addColorStop(1,'rgba(10,8,6,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S*0.6);
  return c;
}
function makeBrick(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#3a2418';g.fillRect(0,0,S,S);
  const BW=64, BH=32, M=3;
  for(let y=0,row=0;y<S;y+=BH,row++){
    const off=row%2===0?0:BW/2;
    for(let x=-BW;x<S;x+=BW){
      const bx=x+off;
      const r=90+Math.random()*40, gg=40+Math.random()*20, bb=25+Math.random()*15;
      g.fillStyle=`rgb(${r|0},${gg|0},${bb|0})`;
      g.fillRect(bx+M, y+M, BW-M*2, BH-M*2);
      g.fillStyle='rgba(0,0,0,0.25)';
      g.fillRect(bx+M, y+BH-M-2, BW-M*2, 2);
      g.fillRect(bx+BW-M-2, y+M, 2, BH-M*2);
      g.fillStyle='rgba(255,220,180,0.08)';
      g.fillRect(bx+M, y+M, BW-M*2, 2);
    }
  }
  noise(g,S,30);
  for(let i=0;i<40;i++){
    const x=Math.random()*S,y=Math.random()*S,r=20+Math.random()*80;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(20,15,10,0.25)');gr.addColorStop(1,'rgba(20,15,10,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  const gr2=g.createLinearGradient(0,S*0.7,0,S);
  gr2.addColorStop(0,'rgba(0,0,0,0)');gr2.addColorStop(1,'rgba(15,10,5,0.6)');
  g.fillStyle=gr2;g.fillRect(0,S*0.7,S,S*0.3);
  return c;
}
function makeTileFloor(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#585650';g.fillRect(0,0,S,S);
  g.strokeStyle='rgba(30,28,24,0.7)';g.lineWidth=2;
  const TS=64;
  for(let x=0;x<=S;x+=TS){g.beginPath();g.moveTo(x,0);g.lineTo(x,S);g.stroke();}
  for(let y=0;y<=S;y+=TS){g.beginPath();g.moveTo(0,y);g.lineTo(S,y);g.stroke();}
  for(let y=0;y<S;y+=TS)for(let x=0;x<S;x+=TS){
    const v=(Math.random()-0.5)*14;
    g.fillStyle=`rgba(${v>0?255:0},${v>0?240:0},${v>0?200:0},${Math.abs(v)/255*0.5})`;
    g.fillRect(x+1,y+1,TS-2,TS-2);
  }
  noise(g,S,30);
  for(let i=0;i<40;i++){
    const x=Math.random()*S,y=Math.random()*S,r=15+Math.random()*70;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(20,20,18,0.35)');gr.addColorStop(1,'rgba(20,20,18,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  return c;
}
function makeMetalCeil(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#3a3835';g.fillRect(0,0,S,S);
  for(let y=0;y<S;y+=8){
    g.fillStyle=y%16===0?'rgba(80,78,74,0.4)':'rgba(20,18,15,0.4)';
    g.fillRect(0,y,S,4);
  }
  g.strokeStyle='rgba(15,12,10,0.8)';g.lineWidth=4;
  for(let x=0;x<S;x+=170){g.beginPath();g.moveTo(x,0);g.lineTo(x,S);g.stroke();}
  g.fillStyle='rgba(140,135,125,0.55)';
  for(let x=20;x<S;x+=170)for(let y=20;y<S;y+=64){
    g.beginPath();g.arc(x,y,2.5,0,Math.PI*2);g.fill();
  }
  for(let i=0;i<18;i++){
    const x=Math.random()*S,y=Math.random()*S,r=20+Math.random()*70;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(120,60,20,0.25)');gr.addColorStop(1,'rgba(120,60,20,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  noise(g,S,25);
  return c;
}
function makePrisonBarTex(){
  const S=128,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#7a5a3a';g.fillRect(0,0,S,S);
  noise(g,S,40);
  for(let i=0;i<40;i++){
    const x=Math.random()*S,y=Math.random()*S,r=4+Math.random()*20;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(120,50,10,0.5)');gr.addColorStop(1,'rgba(120,50,10,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
  }
  return c;
}
function makeSludgeTex(){
  const S=128,c=cv(S),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,S);
  gr.addColorStop(0,'rgba(0,0,0,0.95)');
  gr.addColorStop(0.5,'rgba(5,4,2,0.7)');

function makeHotelWallpaper(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#6a1818';g.fillRect(0,0,S,S);
  g.strokeStyle='rgba(200,160,60,0.55)';g.lineWidth=2;
  for(let y=0;y<S;y+=64){
    for(let x=0;x<S;x+=64){
      const off=(y/64)%2===0?0:32;
      g.beginPath();
      g.arc(x+off+32, y+32, 18, 0, Math.PI*2);
      g.moveTo(x+off+32, y+14);g.lineTo(x+off+32, y+50);
      g.moveTo(x+off+14, y+32);g.lineTo(x+off+50, y+32);
      g.stroke();
      g.beginPath();
      g.arc(x+off+32, y+32, 26, 0, Math.PI*2);
      g.stroke();
    }
  }
  noise(g,S,16);
  const gr=g.createLinearGradient(0,S*0.7,0,S);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(20,5,5,0.6)');
  g.fillStyle=gr;g.fillRect(0,S*0.7,S,S*0.3);
  return c;
}
function makeHotelWoodFloor(){
  const S=512,c=cv(S),g=c.getContext('2d');
  g.fillStyle='#3a2210';g.fillRect(0,0,S,S);
  for(let y=0;y<S;y+=64){
    for(let x=0;x<S;x+=128){
      const off=(y/64)%2===0?0:64;
      const v=(Math.random()-0.5)*20;
      g.fillStyle=`rgb(${60+v|0},${35+v*0.6|0},${15+v*0.3|0})`;
      g.fillRect(x+off+1, y+1, 126, 62);
      g.strokeStyle='rgba(15,8,2,0.7)';g.lineWidth=2;
      g.strokeRect(x+off+1, y+1, 126, 62);
      for(let k=0;k<4;k++){
        g.strokeStyle='rgba(20,12,4,0.35)';g.lineWidth=1;
        g.beginPath();
        g.moveTo(x+off+10, y+10+k*12);
        g.bezierCurveTo(x+off+60, y+8+k*12, x+off+90, y+14+k*12, x+off+118, y+10+k*12);
        g.stroke();
      }
    }
  }
  noise(g,S,20);
  return c;
}

function makeHotelCeil(){

function makePaintingTex(){
  const S=256,c=cv(S),g=c.getContext('2d');
  const kind=(Math.random()*3)|0;
  if(kind===0){
    g.fillStyle='#2a1a10';g.fillRect(0,0,S,S);
    g.fillStyle='#5a3a20';g.beginPath();
    g.ellipse(S/2,S*0.35,S*0.18,S*0.24,0,0,Math.PI*2);g.fill();
    g.fillStyle='#3a2010';
    g.beginPath();g.moveTo(S*0.3,S);g.quadraticCurveTo(S/2,S*0.55,S*0.7,S);g.fill();
    g.fillStyle='#1a0a04';
    g.beginPath();g.arc(S*0.44,S*0.32,3,0,Math.PI*2);g.fill();
    g.beginPath();g.arc(S*0.56,S*0.32,3,0,Math.PI*2);g.fill();
  } else if(kind===1){
    g.fillStyle='#2a3a2a';g.fillRect(0,0,S,S);
    g.fillStyle='#4a4a30';g.fillRect(0,S*0.6,S,S*0.4);
    g.fillStyle='#6a5a3a';g.beginPath();
    g.moveTo(0,S*0.7);g.lineTo(S*0.3,S*0.35);g.lineTo(S*0.6,S*0.65);
    g.lineTo(S,S*0.4);g.lineTo(S,S);g.lineTo(0,S);g.fill();
  } else {
    g.fillStyle='#1a1008';g.fillRect(0,0,S,S);
    g.fillStyle='#4a2a1a';g.beginPath();
    g.ellipse(S*0.4,S*0.7,S*0.12,S*0.2,0,0,Math.PI*2);g.fill();
    g.fillStyle='#8a3a2a';g.beginPath();
    g.arc(S*0.65,S*0.5,S*0.14,0,Math.PI*2);g.fill();
  }
  return c;
}

let grid=[];

function generateMaze(){
  grid=[];
  for(let y=0;y<H;y++) grid.push(new Array(W).fill(1));
  grid[1][1]=0;
  const stack=[[1,1]];
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]];
    for(let i=dirs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[dirs[i],dirs[j]]=[dirs[j],dirs[i]];}
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&grid[ny][nx]===1){
        grid[ny][nx]=0;grid[y+dy/2][x+dx/2]=0;
        stack.push([nx,ny]);moved=true;break;
      }
    }
    if(!moved) stack.pop();
  }
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++) if(grid[y][x]===1 && Math.random()<0.30) grid[y][x]=0;
  grid[1][1]=0;
}
function generateWarehouse(){
  grid=[];
  for(let y=0;y<H;y++) grid.push(new Array(W).fill(0));
  for(let x=0;x<W;x++){grid[0][x]=1;grid[H-1][x]=1;}
  for(let y=0;y<H;y++){grid[y][0]=1;grid[y][W-1]=1;}
  for(let y=3;y<H-3;y+=4)for(let x=3;x<W-3;x+=4){
    if(Math.random()<0.92) grid[y][x]=2;
  }
  for(let k=0;k<7;k++){
    const rx=2+((Math.random()*(W-8))|0);
    const ry=2+((Math.random()*(H-8))|0);
    const rw=3+((Math.random()*4)|0), rh=3+((Math.random()*3)|0);
    const gap=(Math.random()*4)|0;
    for(let x=rx;x<rx+rw && x<W-1;x++)for(let y=ry;y<ry+rh && y<H-1;y++){
      if(x<=0||y<=0) continue;
      const isEdge=(x===rx||x===rx+rw-1||y===ry||y===ry+rh-1);
      if(isEdge){
        if(gap===0 && y===ry && x===rx+((rw/2)|0)) continue;
        if(gap===1 && y===ry+rh-1 && x===rx+((rw/2)|0)) continue;
        if(gap===2 && x===rx && y===ry+((rh/2)|0)) continue;
        if(gap===3 && x===rx+rw-1 && y===ry+((rh/2)|0)) continue;
        grid[y][x]=1;
      }
    }
  }
  for(let y=1;y<=3;y++)for(let x=1;x<=3;x++) grid[y][x]=0;
}
function generateTunnels(){
  grid=[];
  for(let y=0;y<H;y++) grid.push(new Array(W).fill(1));
  grid[1][1]=0;
  const stack=[[1,1]];
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(let i=dirs.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[dirs[i],dirs[j]]=[dirs[j],dirs[i]];}
    let moved=false;
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&grid[ny][nx]===1){
        let openN=0;
        for(const [ddx,ddy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const ax=nx+ddx,ay=ny+ddy;
          if(ax>=0&&ay>=0&&ax<W&&ay<H&&grid[ay][ax]===0) openN++;
        }
        if(openN<=1){grid[ny][nx]=0;stack.push([nx,ny]);moved=true;break;}
      }
    }
    if(!moved){
      if(Math.random()<0.18){
        const [dx,dy]=dirs[0];
        const nx=x+dx,ny=y+dy;
        if(nx>0&&ny>0&&nx<W-1&&ny<H-1&&grid[ny][nx]===1) grid[ny][nx]=0;
      }
      stack.pop();
    }
  }
  for(let k=0;k<5;k++){
    const rx=3+((Math.random()*(W-8))|0);
    const ry=3+((Math.random()*(H-8))|0);
    for(let y=ry;y<ry+3;y++)for(let x=rx;x<rx+4;x++){
      if(x>0&&y>0&&x<W-1&&y<H-1) grid[y][x]=0;
    }
  }
  for(let y=1;y<=2;y++)for(let x=1;x<=2;x++) grid[y][x]=0;
}

    }

  }
  for(let y=2;y<H-2;y+=3){
    if(grid[y][1]===0) grid[y][0]=2;

  }
  grid[1][1]=0;grid[2][1]=0;grid[1][2]=0;

/* ============ BFS ============ */
function bfsDistances(sx,sy){
  const dist=new Int32Array(W*H).fill(-1);
  const start=sy*W+sx; dist[start]=0;
  const q=[start];
  for(let h=0;h<q.length;h++){
    const cur=q[h];const cx=cur%W,cy=(cur-cx)/W;
    const nd=dist[cur]+1;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      if(grid[ny][nx]!==0) continue;
      const k=ny*W+nx;
      if(dist[k]!==-1) continue;
      dist[k]=nd;q.push(k);
    }
  }
  return dist;
}
function bfsPath(sx,sy,tx,ty){
  if(sx===tx&&sy===ty) return [];
  const prev=new Int32Array(W*H).fill(-1);
  const seen=new Uint8Array(W*H);
  const start=sy*W+sx,target=ty*W+tx;
  seen[start]=1;const q=[start];let found=false;
  for(let h=0;h<q.length;h++){
    const cur=q[h];
    if(cur===target){found=true;break;}
    const cx=cur%W,cy=(cur-cx)/W;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      if(grid[ny][nx]!==0) continue;
      const k=ny*W+nx;
      if(seen[k]) continue;
      seen[k]=1;prev[k]=cur;q.push(k);
    }
  }
  if(!found) return [];
  const path=[];let cur=target;
  while(cur!==start&&cur!==-1){
    const x=cur%W,y=(cur-x)/W;
    path.push([x,y]);cur=prev[cur];
  }
  path.reverse();
  return path;
}
function isWall(gx,gy){
  if(gx<0||gy<0||gx>=W||gy>=H) return true;
  return grid[gy][gx]!==0;
}
function collides(x,z){
  const r=PR;
  const x0=Math.round((x-r)/CELL),x1=Math.round((x+r)/CELL);
  const z0=Math.round((z-r)/CELL),z1=Math.round((z+r)/CELL);
  return isWall(x0,z0)||isWall(x1,z0)||isWall(x0,z1)||isWall(x1,z1);
}

function spawnEntity(kind, pos){
  let mesh;
  if(kind==='hound') mesh=makeHound();
  else if(kind==='smiler') mesh=makeSmiler();
  else if(kind==='skinsnatcher') mesh=makeSkinsnatcher();
  else if(kind==='burning') mesh=makeBurning();
  else if(kind==='crawler') mesh=makeCrawler();
  else if(kind==='grey') mesh=makeGrey();
  else if(kind==='moth_male') mesh=makeDeathmoth(false);
  else if(kind==='moth_female') mesh=makeDeathmoth(true);
  else mesh=makeFaceless();

  mesh.position.copy(pos);
  if(levelGroup) levelGroup.add(mesh);

  const cfg={
    hound:{speed:4.2,frozen:1.2,kill:1.5},
    smiler:{speed:2.4,frozen:1.0,kill:1.3},
    skinsnatcher:{speed:3.4,frozen:3.0,kill:1.3},
    burning:{speed:3.0,frozen:1.5,kill:1.4},
    crawler:{speed:3.8,frozen:1.2,kill:1.2},
    grey:{speed:2.0,frozen:2.0,kill:1.3},
    moth_male:{speed:2.2,frozen:1.0,kill:1.2},
    moth_female:{speed:5.0,frozen:0.5,kill:1.4},
    faceless:{speed:1.4,frozen:1.2,kill:1.15}
  }[kind] || {speed:1.4,frozen:1.2,kill:1.15};

  entities.push({kind, mesh, pos:pos.clone(), path:[], repath:0,
    speed:cfg.speed, frozen:cfg.frozen, killR:cfg.kill});
}
function updateEntities(dt){
  const px=player.pos.x, pz=player.pos.z;
  for(let i=entities.length-1;i>=0;i--){
    const e=entities[i];
    if(!e.mesh) continue;
    if(e.frozen>0) e.frozen-=dt;
    else{
      let nearSafe=false;
      for(const s of safeZones){
        if(Math.hypot(e.pos.x-s.x, e.pos.z-s.z)<s.r){nearSafe=true;break;}
      }
      e.repath-=dt;
      if(e.repath<=0){
        e.repath=(e.kind==='hound'||e.kind==='burning'||e.kind==='moth_female')?0.4:0.75;
        const ex=Math.round(e.pos.x/CELL),ey=Math.round(e.pos.z/CELL);
        const tx=Math.round(px/CELL),ty=Math.round(pz/CELL);
        if(!isWall(ex,ey)&&!isWall(tx,ty)) e.path=bfsPath(ex,ey,tx,ty);
        else e.path=[];
      }
      if(e.path.length && !nearSafe){
        const [tx,ty]=e.path[0];
        const target=new THREE.Vector3(tx*CELL,0,ty*CELL);
        const dir=target.clone().sub(e.pos);dir.y=0;
        const d=dir.length();
        if(d<0.25) e.path.shift();
        else{
          dir.normalize();
          let mult=1.0;
          if(e.kind==='hound' && !blackout) mult=0.35;
          if(e.kind==='smiler') mult=blackout?1.0:0.35;
          e.pos.addScaledVector(dir, e.speed*mult*dt);
          e.mesh.rotation.y=Math.atan2(dir.x, dir.z);
        }
      }
    }
    const t=performance.now()*0.002;
    const isMoth=(e.kind==='moth_male'||e.kind==='moth_female');
    e.mesh.position.set(
      e.pos.x,
      isMoth?(1.7+Math.sin(t*3+e.speed)*0.35):((e.kind==='hound'||e.kind==='crawler')?0:Math.sin(t+e.speed)*0.05),
      e.pos.z
    );
    if(isMoth){
      e.mesh.rotation.z=Math.sin(t*8)*0.25;
      e.mesh.rotation.x=Math.sin(t*6)*0.15;
    }
    const d2=Math.hypot(px-e.pos.x, pz-e.pos.z);
    if(d2<e.killR && e.frozen<=0 && state==='playing'){ die(); return; }
  }
}
function clearEntities(){
  for(const e of entities){if(e.mesh && levelGroup) levelGroup.remove(e.mesh);}
  entities.length=0;
}

function makeCrateMesh(){
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,1.1),M.crate);box.position.y=0.55;g.add(box);
  return g;
}
function findOpenCell(){
  for(let k=0;k<50;k++){
    const x=2+((Math.random()*(W-4))|0);
    const y=2+((Math.random()*(H-4))|0);
    if(grid[y][x]===0) return {x,y};
  }
  return null;
}
function spawnCrate(){
  const cell=findOpenCell();if(!cell)return;
  const g=makeCrateMesh();g.position.set(cell.x*CELL,0,cell.y*CELL);
  g.rotation.y=Math.random()*Math.PI*2;
  if(levelGroup) levelGroup.add(g);
  crates.push({mesh:g, life:0, ttl:20+Math.random()*30});
}
function updateCrates(dt){
  if(level!==1) return;
  crateNextSpawn-=dt;
  if(crateNextSpawn<=0){
    crateNextSpawn=8+Math.random()*14;
    if(crates.length<14) spawnCrate();
  }
  for(let i=crates.length-1;i>=0;i--){
    const c=crates[i];c.life+=dt;
    const t=c.life/c.ttl;
    c.mesh.scale.setScalar(Math.min(1, Math.min(t*3,(1-t)*3)));
    if(t>=1){if(levelGroup) levelGroup.remove(c.mesh);crates.splice(i,1);}
  }
}
function clearCrates(){
  for(const c of crates){if(levelGroup) levelGroup.remove(c.mesh);}
  crates.length=0;
}
function spawnDrawing(){
  for(let k=0;k<40;k++){
    const x=2+((Math.random()*(W-4))|0);
    const y=2+((Math.random()*(H-4))|0);
    if(grid[y][x]!==1) continue;
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      const nx=x+dx,ny=y+dy;
      if(grid[ny] && grid[ny][nx]===0){
        const tex=TEX.drawings[(Math.random()*TEX.drawings.length)|0];
        const mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0.85, fog:true, depthWrite:false});
        const plane=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.6),mat);
        plane.position.set(x*CELL-dx*CELL*0.495, 1.6, y*CELL-dy*CELL*0.495);
        plane.lookAt(x*CELL+dx*CELL, 1.6, y*CELL+dy*CELL);
        if(levelGroup) levelGroup.add(plane);
        wallDrawings.push({mesh:plane, mat});
        return;
      }
    }
  }
}
function updateDrawings(dt){
  if(level!==1) return;
  for(let i=wallDrawings.length-1;i>=0;i--){
    const d=wallDrawings[i];
    const toObj=new THREE.Vector3().subVectors(d.mesh.position, camera.position);
    const dist=toObj.length();toObj.normalize();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const dot=toObj.dot(fwd);
    const lightOK=!blackout && dist<14 && playerLight.intensity>10;
    const viewOK=dot>0.35;
    const target=(lightOK&&viewOK)?0.9:0.0;
    d.mat.opacity+=(target-d.mat.opacity)*Math.min(1, dt*6);
    if(!lightOK && d.mat.opacity<0.02){
      if(levelGroup) levelGroup.remove(d.mesh);
      d.mesh.geometry.dispose();d.mat.dispose();
      wallDrawings.splice(i,1);
    }
  }
  if(Math.random()<0.02 && wallDrawings.length<8) spawnDrawing();
}
function clearDrawings(){
  for(const d of wallDrawings){
    if(levelGroup) levelGroup.remove(d.mesh);
    d.mesh.geometry.dispose();d.mat.dispose();
  }
  wallDrawings.length=0;
}

    g.lookAt(player.pos.x, 1.3, player.pos.z);
    item.mesh=g;item.ttl=3.0;
  } else if(type==='shadow'){

    const head=new THREE.Mesh(new THREE.SphereGeometry(0.17,10,8),mat.clone());head.position.y=1.28;g.add(head);

    g.position.set(player.pos.x+Math.sin(ang)*dist, 0, player.pos.z+Math.cos(ang)*dist);
    item.mesh=g;item.ttl=6.0;item.gazed=0;
  } else return;
  halluGroup.add(item.mesh);halluItems.push(item);

function updateHallucinations(dt){
  for(let i=halluItems.length-1;i>=0;i--){
    const it=halluItems[i];
    it.life+=dt;
    const t=it.life/it.ttl;
    const fade=Math.min(1, Math.min(t*4,(1-t)*4));
    it.mesh.traverse(o=>{
      if(o.material && o.material.transparent){
        o.material.opacity=fade*(it.type==='shadow'?0.95:0.85);
      }
    });
    if(it.type==='shadow'){
      const toObj=new THREE.Vector3().subVectors(it.mesh.position, camera.position).normalize();
      const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      if(toObj.dot(fwd)>0.82){
        it.gazed+=dt;
        if(it.gazed>0.15){halluGroup.remove(it.mesh);disposeGroup(it.mesh);halluItems.splice(i,1);continue;}
      } else it.gazed=0;
    }
    if(t>=1){halluGroup.remove(it.mesh);disposeGroup(it.mesh);halluItems.splice(i,1);}
  }
}
function clearHallucinations(){
  for(const it of halluItems){halluGroup.remove(it.mesh);disposeGroup(it.mesh);}
  halluItems.length=0;
}

let actx=null, masterGain=null, humGain=null, buzzGain=null, noiseBuf=null, muted=false;
function initAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  masterGain=actx.createGain();masterGain.gain.value=muted?0:0.55;masterGain.connect(actx.destination);

  humGain=actx.createGain();humGain.gain.value=0.075;humGain.connect(masterGain);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;lp.connect(humGain);
  const o1=actx.createOscillator();o1.type='sawtooth';o1.frequency.value=60;
  const o2=actx.createOscillator();o2.type='square';o2.frequency.value=119.5;
  const o3=actx.createOscillator();o3.type='sine';o3.frequency.value=240;
  o1.connect(lp);o2.connect(lp);o3.connect(lp);o1.start();o2.start();o3.start();

  buzzGain=actx.createGain();buzzGain.gain.value=0;buzzGain.connect(masterGain);
  const buzzOsc=actx.createOscillator();buzzOsc.type='sawtooth';buzzOsc.frequency.value=5200;
  const buzzLfo=actx.createOscillator();buzzLfo.type='sine';buzzLfo.frequency.value=8;
  const buzzLfoG=actx.createGain();buzzLfoG.gain.value=500;
  buzzLfo.connect(buzzLfoG);buzzLfoG.connect(buzzOsc.frequency);
  const buzzBp=actx.createBiquadFilter();buzzBp.type='bandpass';buzzBp.frequency.value=4800;buzzBp.Q.value=4;
  buzzOsc.connect(buzzBp);buzzBp.connect(buzzGain);buzzOsc.start();buzzLfo.start();

  noiseBuf=actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
}
function footstep(){
  if(!actx||muted) return;
  const t=actx.currentTime;
  const src=actx.createBufferSource();src.buffer=noiseBuf;
  src.playbackRate.value=0.8+Math.random()*0.4;
  const bp=actx.createBiquadFilter();bp.type='bandpass';
  bp.frequency.value=260+Math.random()*220;bp.Q.value=1.1;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.22,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.17);
  src.connect(bp);bp.connect(g);g.connect(masterGain);
  src.start(t);src.stop(t+0.22);
}

    if(grid[y][x]!==0) continue;
    if(Math.random()>0.18) continue;
    const lr=grid[y][x-1]===0||grid[y][x+1]===0;
    const ud=grid[y-1][x]===0||grid[y+1][x]===0;
    const upY=WALL_H-0.25-Math.random()*0.3;
    if(lr) pipeList.push({x:x*CELL, y:upY, z:y*CELL+(Math.random()-0.5)*0.5, ry:0, len:CELL*1.02});
    if(ud) pipeList.push({x:x*CELL+(Math.random()-0.5)*0.5, y:upY-0.18, z:y*CELL, ry:Math.PI/2, len:CELL*1.02});
  }
  const pipeMesh=new THREE.InstancedMesh(pipeUnit, M.pipe, pipeList.length);
  pipeList.forEach((p,i)=>{
    const m=new THREE.Matrix4();
    const rot=new THREE.Matrix4().makeRotationY(p.ry);
    const scl=new THREE.Matrix4().makeScale(1,1,p.len);
    m.copy(rot).multiply(scl);m.setPosition(p.x,p.y,p.z);pipeMesh.setMatrixAt(i,m);
  });
  pipeMesh.instanceMatrix.needsUpdate=true;levelGroup.add(pipeMesh);

  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    if(grid[y][x]!==1) continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(grid[ny] && grid[ny][nx]===0 && Math.random()<0.06){
        const pl=new THREE.Mesh(new THREE.PlaneGeometry(0.4,1.6), M.sludge);
        pl.position.set(x*CELL-dx*CELL*0.499, 1.4, y*CELL-dy*CELL*0.499);
        pl.lookAt(x*CELL+dx*CELL, 1.4, y*CELL+dy*CELL);levelGroup.add(pl);
      }
    }
  }

  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    if(grid[y][x]!==0) continue;
    const openLR = grid[y][x-1]===0 && grid[y][x+1]===0 && grid[y-1][x]===1 && grid[y+1][x]===1;
    const openUD = grid[y-1][x]===0 && grid[y+1][x]===0 && grid[y][x-1]===1 && grid[y][x+1]===1;
    if(openLR && Math.random()<0.16){
      const n=5+((Math.random()*3)|0);
      for(let k=0;k<n;k++){
        const px=x*CELL - CELL/2 + (k+1)*(CELL/(n+1));
        const bar=new THREE.Mesh(new THREE.BoxGeometry(0.07,WALL_H,0.07), M.bar);
        bar.position.set(px, WALL_H/2, y*CELL);levelGroup.add(bar);
      }
      const bl=new THREE.PointLight(0xff5520, 3, 8, 1.8);
      bl.position.set(x*CELL, 2.2, y*CELL);levelGroup.add(bl);
    }
    if(openUD && Math.random()<0.16){
      const n=5+((Math.random()*3)|0);
      for(let k=0;k<n;k++){
        const pz=y*CELL - CELL/2 + (k+1)*(CELL/(n+1));
        const bar=new THREE.Mesh(new THREE.BoxGeometry(0.07,WALL_H,0.07), M.bar);
        bar.position.set(x*CELL, WALL_H/2, pz);levelGroup.add(bar);
      }
      const bl=new THREE.PointLight(0xff5520, 3, 8, 1.8);
      bl.position.set(x*CELL, 2.2, y*CELL);levelGroup.add(bl);
    }
  }

  const lampCells=[];
  for(let y=2;y<H-2;y+=3)for(let x=2;x<W-2;x+=3){
    if(grid[y][x]===0 && Math.random()<0.45) lampCells.push([x,y]);
  }
  const lg=new THREE.PlaneGeometry(1.4,0.32);lg.rotateX(Math.PI/2);
  lampsMesh=new THREE.InstancedMesh(lg, M.lamp3, lampCells.length);
  const col=new THREE.Color();
  lampCells.forEach(([x,y],i)=>{
    mat4.makeTranslation(x*CELL, WALL_H-0.05, y*CELL);
    lampsMesh.setMatrixAt(i,mat4);
    const b=0.6+Math.random()*0.3;col.setRGB(b, b*0.85, b*0.55);
    lampsMesh.setColorAt(i,col);lampData.push({b, t:0.6+Math.random()*0.3});
  });
  lampsMesh.instanceMatrix.needsUpdate=true;
  if(lampsMesh.instanceColor) lampsMesh.instanceColor.needsUpdate=true;
  levelGroup.add(lampsMesh);

  exitMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.9), M.exit);
  exitMesh.position.set(exitPos.x, 1.45, exitPos.z);
  exitMesh.rotation.y=Math.random()*Math.PI*2;levelGroup.add(exitMesh);
  exitLight=new THREE.PointLight(0x66ffcc, 16, 18, 2);
  exitLight.position.set(exitPos.x, 1.8, exitPos.z);levelGroup.add(exitLight);

  for(const gr of genRooms){
    const gx=gr.cx*CELL, gz=gr.cy*CELL;
    const gen=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.3,1.0), M.generator);
    gen.position.set(gx, 0.65, gz);levelGroup.add(gen);
    const core=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,10), M.generatorGlow);
    core.position.set(gx+0.5, 0.9, gz+0.35);levelGroup.add(core);
    const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,1.8,10), M.pipe);
    pipe.position.set(gx-0.5, 1.7, gz);pipe.rotation.z=Math.PI/2;levelGroup.add(pipe);
    const light=new THREE.PointLight(0xff4020, 12, 9, 1.8);
    light.position.set(gx, 1.6, gz);levelGroup.add(light);
    generatorLights.push({light, core, base:12});
  }

  const used=new Set();
  for(let k=0;k<4;k++){
    let hx,hy,ok=false;
    for(let a=0;a<80 && !ok;a++){
      const tx=3+((Math.random()*(W-6))|0), ty=3+((Math.random()*(H-6))|0);
      if(grid[ty][tx]!==0) continue;
      const key=tx+','+ty;
      if(used.has(key)) continue;
      if(Math.hypot(tx-1, ty-1)<6) continue;
      used.add(key);hx=tx;hy=ty;ok=true;
    }
    if(!ok) continue;
    const hz={x:hx*CELL, z:hy*CELL, r:5.0};heatZones.push(hz);
    const circ=new THREE.Mesh(new THREE.CircleGeometry(hz.r-0.5,20), M.heatGlow);
    circ.rotation.x=-Math.PI/2; circ.position.set(hz.x,0.03,hz.z);levelGroup.add(circ);
    const hL=new THREE.PointLight(0xff4a08, 14, hz.r*1.7, 1.7);
    hL.position.set(hz.x, 2.2, hz.z);levelGroup.add(hL);
  }

  deltaCenter.set(2.5*CELL, 0, (H-3.5)*CELL);
  ntozCenter.set((W-3.5)*CELL, 0, 2.5*CELL);
  safeZones.push({x:deltaCenter.x, z:deltaCenter.z, r:11, name:'БАЗА ГАММА (Б.И.Г.)'});
  safeZones.push({x:ntozCenter.x, z:ntozCenter.z, r:11, name:'СКЛАД Н.Т.О.З.'});
  for(const s of safeZones){
    const pl=new THREE.Mesh(new THREE.CircleGeometry(6,24), M.safeGlowG);
    pl.rotation.x=-Math.PI/2; pl.position.set(s.x,0.02,s.z);levelGroup.add(pl);
    const l=new THREE.PointLight(0xffc060, 24, 22, 1.6);l.position.set(s.x, 2.7, s.z);levelGroup.add(l);
  }
  for(let k=0;k<6;k++){
    const c=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), M.crate);
    c.position.set(deltaCenter.x+(Math.random()-0.5)*5, 0.45, deltaCenter.z+(Math.random()-0.5)*5);
    c.rotation.y=Math.random()*Math.PI;levelGroup.add(c);
  }
  for(let k=0;k<3;k++){
    const shelf=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.6,0.6), M.shelf);
    shelf.position.set(ntozCenter.x+(Math.random()-0.5)*5, 0.8, ntozCenter.z+(Math.random()-0.5)*5);
    shelf.rotation.y=Math.random()*Math.PI;levelGroup.add(shelf);
  }

  for(let k=0;k<6;k++){
    const cell=findOpenCell();if(!cell) continue;
    const am=makeAlmond();
    am.position.set(cell.x*CELL, 0, cell.y*CELL);
    levelGroup.add(am);
    almondPickups.push({mesh:am, x:cell.x*CELL, z:cell.y*CELL, life:0});
  }

  const types=['hound','smiler','skinsnatcher','burning','crawler','burning','hound','smiler','crawler','faceless'];
  const count=Math.min(8, 4+lvl);
  for(let k=0;k<count;k++){
    let fx,fy,ok=false;
    for(let a=0;a<80 && !ok;a++){
      fx=3+((Math.random()*(W-6))|0);fy=3+((Math.random()*(H-6))|0);
      if(grid[fy][fx]===0 && Math.hypot(fx-bx, fy-by)>5) ok=true;
    }
    if(!ok) continue;
    const kind=types[(Math.random()*types.length)|0];
    spawnEntity(kind, new THREE.Vector3(fx*CELL, 0, fy*CELL));
  }
  explosionCooldown=20;blackout=false;blackoutEl.style.opacity=0;
  if(actx && humGain) humGain.gain.setValueAtTime(0.05, actx.currentTime);
}

/* УРОВЕНЬ 4 */
function buildLevel4(lvl){
  generateOffice();
  const dist=bfsDistances(1,1);
  let best=-1,bx=1,by=1;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    if(grid[y][x]===0){const d=dist[y*W+x];if(d>best){best=d;bx=x;by=y;}}
  }
  exitPos.set(bx*CELL,0,by*CELL);

  const fg=new THREE.PlaneGeometry(W*CELL,H*CELL);fg.rotateX(-Math.PI/2);
  fg.translate((W-1)*CELL/2,0,(H-1)*CELL/2);levelGroup.add(new THREE.Mesh(fg, M.floor4));
  const cg=new THREE.PlaneGeometry(W*CELL,H*CELL);cg.rotateX(Math.PI/2);
  cg.translate((W-1)*CELL/2, WALL_H, (H-1)*CELL/2);levelGroup.add(new THREE.Mesh(cg, M.ceil4));

  const wallCells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(grid[y][x]===1) wallCells.push([x,y]);
  const mat4=new THREE.Matrix4();
  const walls=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,WALL_H,CELL), M.wall4, wallCells.length);
  wallCells.forEach(([x,y],i)=>{mat4.makeTranslation(x*CELL,WALL_H/2,y*CELL);walls.setMatrixAt(i,mat4);});
  walls.instanceMatrix.needsUpdate=true;levelGroup.add(walls);

  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=grid[y][x];
    if(v!==2 && v!==3) continue;
    const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
    for(const [dx,dy] of dirs){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      if(grid[ny][nx]===0){
        const mat=v===2?M.winDark:M.winLight;
        const w=new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.85, WALL_H*0.7), mat);
        w.position.set((x-dx*0.505)*CELL, WALL_H*0.55, (y-dy*0.505)*CELL);
        w.lookAt(x*CELL, WALL_H*0.55, y*CELL);
        levelGroup.add(w);
        windows.push({mesh:w, dark:v===2, x:x*CELL, z:y*CELL});
      }
    }
  }

  const lampCells=[];
  for(let y=2;y<H-2;y+=2)for(let x=2;x<W-2;x+=2){
    if(grid[y][x]===0 && Math.random()<0.55) lampCells.push([x,y]);
  }
  const lg=new THREE.PlaneGeometry(1.2,1.2);lg.rotateX(Math.PI/2);
  lampsMesh=new THREE.InstancedMesh(lg, M.lamp4, lampCells.length);
  const col=new THREE.Color();
  lampCells.forEach(([x,y],i)=>{
    mat4.makeTranslation(x*CELL, WALL_H-0.03, y*CELL);
    lampsMesh.setMatrixAt(i,mat4);
    const b=0.85+Math.random()*0.15;
    col.setRGB(b, b*0.98, b*0.92);
    lampsMesh.setColorAt(i,col);
    lampData.push({b, t:0.9+Math.random()*0.1});
  });
  lampsMesh.instanceMatrix.needsUpdate=true;
  if(lampsMesh.instanceColor) lampsMesh.instanceColor.needsUpdate=true;
  levelGroup.add(lampsMesh);

  exitMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.9), M.exit);
  exitMesh.position.set(exitPos.x, 1.45, exitPos.z);
  exitMesh.rotation.y=Math.random()*Math.PI*2;levelGroup.add(exitMesh);
  exitLight=new THREE.PointLight(0x66ffcc, 16, 18, 2);
  exitLight.position.set(exitPos.x, 1.8, exitPos.z);levelGroup.add(exitLight);

  const usedCells=new Set();
  function pickCell(){
    for(let k=0;k<40;k++){
      const cell=findOpenCell();
      if(!cell) continue;
      const key=cell.x+','+cell.y;
      if(usedCells.has(key)) continue;
      if(Math.hypot(cell.x-bx, cell.y-by)<3) continue;
      usedCells.add(key);
      return cell;
    }
    return null;
  }

  for(let k=0;k<6;k++){
    const cell=pickCell(); if(!cell) continue;
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(0.5,1.6,0.5), M.cooler);
    body.position.y=0.8; g.add(body);
    g.position.set(cell.x*CELL, 0, cell.y*CELL);
    g.rotation.y=Math.random()*Math.PI*2;
    levelGroup.add(g);
    coolers.push({mesh:g, x:cell.x*CELL, z:cell.y*CELL});
  }
  for(let k=0;k<4;k++){
    const cell=pickCell(); if(!cell) continue;
    const v=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.9,0.7), M.vending);
    v.position.set(cell.x*CELL, 0.95, cell.y*CELL);
    v.rotation.y=Math.floor(Math.random()*4)*(Math.PI/2);
    levelGroup.add(v);
    vendings.push({mesh:v, x:cell.x*CELL, z:cell.y*CELL, life:0, used:false});
  }
  for(let k=0;k<4;k++){
    const cell=pickCell(); if(!cell) continue;
    const g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.4,0.7,10), M.fountain);
    base.position.y=0.35; g.add(base);
    const water=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.05,10), M.fountainWater);
    water.position.y=0.7; g.add(water);
    g.position.set(cell.x*CELL, 0, cell.y*CELL);
    levelGroup.add(g);
    almondPickups.push({mesh:g, x:cell.x*CELL, z:cell.y*CELL, life:0, isFountain:true});
  }

  omegaCenter.set(2.5*CELL, 0, (H-3.5)*CELL);
  amorCenter.set((W-3.5)*CELL, 0, 2.5*CELL);
  orCenter.set((W-3.5)*CELL, 0, (H-3.5)*CELL);
  safeZones.push({x:omegaCenter.x, z:omegaCenter.z, r:11, name:'БАЗА ОМЕГА (Б.И.Г.)'});
  safeZones.push({x:amorCenter.x,  z:amorCenter.z,  r:9,  name:'AMOR INCREMENTUM'});
  safeZones.push({x:orCenter.x,    z:orCenter.z,    r:9,  name:'О.Р. (ОСТАВАЙСЯ РЕШИТЕЛЬНЫМ)'});
  for(const s of safeZones){
    const glowMat = s.name.startsWith('БАЗА ОМЕГА') ? M.safeGlowG
                   : s.name.startsWith('AMOR')       ? M.safeGlowR
                   : M.safeGlowO;
    const pl=new THREE.Mesh(new THREE.CircleGeometry(6,24), glowMat);
    pl.rotation.x=-Math.PI/2; pl.position.set(s.x,0.02,s.z);levelGroup.add(pl);
    const l=new THREE.PointLight(s.name.startsWith('AMOR')?0xff5020:0xffe0a0, 24, 22, 1.6);
    l.position.set(s.x, 2.7, s.z);levelGroup.add(l);
  }
  for(let k=0;k<6;k++){
    const c=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), M.crate);
    c.position.set(omegaCenter.x+(Math.random()-0.5)*5, 0.45, omegaCenter.z+(Math.random()-0.5)*5);
    c.rotation.y=Math.random()*Math.PI;levelGroup.add(c);
  }
  for(let k=0;k<8;k++){
    const mold=new THREE.Mesh(new THREE.SphereGeometry(0.2+Math.random()*0.15,8,6),
      new THREE.MeshLambertMaterial({color:0x4a6a3a}));
    mold.position.set(amorCenter.x+(Math.random()-0.5)*4, 0.15, amorCenter.z+(Math.random()-0.5)*4);
    mold.scale.y=0.5;
    levelGroup.add(mold);
  }
  const altar=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.9,0.9), M.shelf);
  altar.position.set(amorCenter.x, 0.45, amorCenter.z);levelGroup.add(altar);
  for(let k=0;k<4;k++){
    const shelf=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,0.5), M.shelf);
    shelf.position.set(orCenter.x+(Math.random()-0.5)*4, 0.8, orCenter.z+(Math.random()-0.5)*4);
    shelf.rotation.y=Math.random()*Math.PI;levelGroup.add(shelf);
  }

  const types=['hound','grey','hound','grey'];
  const count=Math.min(4, 2+lvl);
  for(let k=0;k<count;k++){
    let fx,fy,ok=false;
    for(let a=0;a<80 && !ok;a++){
      fx=3+((Math.random()*(W-6))|0);fy=3+((Math.random()*(H-6))|0);
      if(grid[fy][fx]===0 && Math.hypot(fx-bx, fy-by)>6) ok=true;
    }
    if(!ok) continue;
    const kind=types[(Math.random()*types.length)|0];
    spawnEntity(kind, new THREE.Vector3(fx*CELL, 0, fy*CELL));
  }
  trapCooldown=0;
  blackout=false;blackoutEl.style.opacity=0;
  if(actx && humGain) humGain.gain.setValueAtTime(0.03, actx.currentTime);
}

/* УРОВЕНЬ 5 */
function buildLevel5(lvl){
  generateHotel();
  const dist=bfsDistances(1,1);
  let best=-1,bx=1,by=1;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    if(grid[y][x]===0){const d=dist[y*W+x];if(d>best){best=d;bx=x;by=y;}}
  }
  exitPos.set(bx*CELL,0,by*CELL);

  const bcx=Math.floor(W/2), bcy=Math.floor(H/2);
  beverlyCenter.set(bcx*CELL, 0, bcy*CELL);

  const fgWood=new THREE.PlaneGeometry(W*CELL,H*CELL);fgWood.rotateX(-Math.PI/2);
  fgWood.translate((W-1)*CELL/2,0,(H-1)*CELL/2);
  levelGroup.add(new THREE.Mesh(fgWood, M.floor5Wood));

  const marbleDisc=new THREE.Mesh(new THREE.CircleGeometry(CELL*3.5, 32), M.floor5Marble);
  marbleDisc.rotation.x=-Math.PI/2;
  marbleDisc.position.set(beverlyCenter.x, 0.02, beverlyCenter.z);
  levelGroup.add(marbleDisc);

  const carpetDisc=new THREE.Mesh(new THREE.CircleGeometry(CELL*5, 32),
    new THREE.MeshLambertMaterial({color:0x8a2028, map:hotelWoodTex}));
  carpetDisc.rotation.x=-Math.PI/2;
  carpetDisc.position.set(CELL*3.5, 0.01, CELL*3.5);
  levelGroup.add(carpetDisc);

  const cg=new THREE.PlaneGeometry(W*CELL,H*CELL);cg.rotateX(Math.PI/2);
  cg.translate((W-1)*CELL/2, WALL_H, (H-1)*CELL/2);
  levelGroup.add(new THREE.Mesh(cg, M.ceil5));

  const wallCells=[], columnCells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]===1) wallCells.push([x,y]);
    else if(grid[y][x]===2) columnCells.push([x,y]);
  }
  const mat4=new THREE.Matrix4();
  const walls=new THREE.InstancedMesh(new THREE.BoxGeometry(CELL,WALL_H,CELL), M.wall5, wallCells.length);
  wallCells.forEach(([x,y],i)=>{mat4.makeTranslation(x*CELL,WALL_H/2,y*CELL);walls.setMatrixAt(i,mat4);});
  walls.instanceMatrix.needsUpdate=true;
  levelGroup.add(walls);

  for(const [x,y] of columnCells){
    const col=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.36,WALL_H,12), M.woodFurniture);
    col.position.set(x*CELL, WALL_H/2, y*CELL);
    levelGroup.add(col);
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.15,12), M.goldPlate);
    base.position.set(x*CELL, 0.08, y*CELL);
    levelGroup.add(base);
    const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.15,12), M.goldPlate);
    cap.position.set(x*CELL, WALL_H-0.08, y*CELL);
    levelGroup.add(cap);
  }

  const chandelierSpots=[
    [bcx, bcy], [3.5, 3.5], [W-4, 3.5], [3.5, H-4], [W-4, H-4]
  ];
  for(const [cx,cy] of chandelierSpots){
    const g=new THREE.Group();
    const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.8,8), M.chandelierMat);
    rod.position.y=WALL_H-0.4;g.add(rod);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.7,0.05,6,16), M.chandelierMat);
    ring.position.y=WALL_H-0.6;ring.rotation.x=Math.PI/2;g.add(ring);
    for(let k=0;k<8;k++){
      const a=(k/8)*Math.PI*2;
      const candle=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,6), M.chandelierGlow);
      candle.position.set(Math.cos(a)*0.7, WALL_H-0.55, Math.sin(a)*0.7);
      g.add(candle);
    }
    g.position.set(cx*CELL, 0, cy*CELL);
    levelGroup.add(g);
    const light=new THREE.PointLight(0xffd890, 18, 16, 1.6);
    light.position.set(cx*CELL, WALL_H-0.5, cy*CELL);
    levelGroup.add(light);

function mutateSpace(){
  dejaVuEl.style.transition='opacity .25s ease';

/* ============ ИГРОК ============ */
function tryMove(pos,dx,dz){
  if(!collides(pos.x+dx, pos.z)) pos.x+=dx;
  if(!collides(pos.x, pos.z+dz)) pos.z+=dz;
}
const keys={w:false,a:false,s:false,d:false,shift:false};

function updatePlayer(dt){
  let mx=0,mz=0;
  if(keys.w) mz+=1;
  if(keys.s) mz-=1;
  if(keys.a) mx-=1;
  if(keys.d) mx+=1;
  const speed=keys.shift?6.2:3.6;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const dir=new THREE.Vector3().addScaledVector(fwd,mz).addScaledVector(right,mx);
  const moving=dir.lengthSq()>0.0001;
  if(moving) dir.normalize();

  if(moving){
    const step=speed*dt;
    const px=player.pos.x, pz=player.pos.z;
    tryMove(player.pos, dir.x*step, dir.z*step);
    const d=Math.hypot(player.pos.x-px, player.pos.z-pz);
    distanceTraveled+=d; mutateAccum+=d;
  }
  const prevSin=Math.sin(player.bob);
  if(moving) player.bob+=dt*speed*1.65;
  const bobY=moving?Math.sin(player.bob)*0.055:0;
  camRoll=moving?Math.sin(player.bob)*0.012:0;
  const curSin=Math.sin(player.bob);
  if(moving && prevSin<0 && curSin>=0) footstep();

  camera.position.set(player.pos.x, player.pos.y+player.eye+bobY, player.pos.z);
  camera.rotation.set(pitch, yaw, camRoll);

  playerLight.position.set(player.pos.x, player.pos.y+2.4, player.pos.z);
  const flick=0.93+Math.random()*0.07;
  const baseI=blackout?4:(level===2?20:(level===3?22:(level===4?30:(level===5?16:26))));
  const baseD=blackout?9:(level===2?18:(level===3?20:(level===4?22:(level===5?16:24))));
  playerLight.intensity=baseI*flick;
  playerLight.distance=baseD;

  if(level===0 && mutateAccum>MUTATE_EVERY){
    mutateAccum=0;
    mutateSpace();
    return;
  }
}

/* ============ ЛАМПЫ ============ */
const tmpColor=new THREE.Color();
function updateLamps(dt){
  if(!lampsMesh || !lampData.length) return;
  for(let i=0;i<lampData.length;i++){
    const L=lampData[i];
    if(Math.random()<0.0035){
      L.t=Math.random()<0.55?0.05:(0.72+Math.random()*0.28);
    }
    L.b+=(L.t-L.b)*Math.min(1, dt*11);
    if(blackout){
      tmpColor.setRGB(L.b*0.05, L.b*0.05, L.b*0.08);
    } else if(level===3){
      tmpColor.setRGB(L.b, L.b*0.85, L.b*0.55);
    } else if(level===2){
      tmpColor.setRGB(L.b*0.9, L.b*0.92, L.b*0.95);
    } else if(level===4){
      tmpColor.setRGB(L.b, L.b*0.98, L.b*0.92);
    } else if(level===5){
      tmpColor.setRGB(L.b, L.b*0.85, L.b*0.55);
    } else {
      tmpColor.setRGB(L.b, L.b*0.97, L.b*0.84);
    }
    lampsMesh.setColorAt(i, tmpColor);
  }
  if(lampsMesh.instanceColor) lampsMesh.instanceColor.needsUpdate=true;
}

/* ============ БЛЭКАУТЫ ============ */
function updateBlackout(dt){
  if(level!==1) return;
  blackoutTimer+=dt;
  if(!blackout && blackoutTimer>blackoutNext){
    blackout=true;blackoutTimer=0;
    blackoutNext=20+Math.random()*20;
    blackoutEl.style.opacity=0.94;
    toast('СВЕТ ГАСНЕТ...', 1400);
    if(actx && !muted && humGain){
      humGain.gain.cancelScheduledValues(actx.currentTime);
      humGain.gain.setValueAtTime(0.005, actx.currentTime);
    }
    if(Math.random()<0.85){
      let fx,fy,ok=false;
      for(let a=0;a<40 && !ok;a++){
        const ang=Math.random()*Math.PI*2,r=12+Math.random()*10;
        fx=Math.round(player.pos.x/CELL)+Math.round(Math.cos(ang)*r);
        fy=Math.round(player.pos.z/CELL)+Math.round(Math.sin(ang)*r);
        if(fx>1&&fy>1&&fx<W-1&&fy<H-1&&grid[fy][fx]===0) ok=true;
      }
      if(ok){
        const kind=Math.random()<0.45?'hound':'faceless';
        spawnEntity(kind, new THREE.Vector3(fx*CELL, 0, fy*CELL));
        if(kind==='hound') playHoundGrowl();
      }
    }
  } else if(blackout && blackoutTimer>blackoutNext){
    blackout=false;blackoutTimer=0;
    blackoutNext=35+Math.random()*25;
    blackoutEl.style.opacity=0;
    if(actx && !muted && humGain){
      humGain.gain.cancelScheduledValues(actx.currentTime);
      humGain.gain.setValueAtTime(0.075, actx.currentTime);
    }
  }
}

/* ============ ЖАРА ============ */
let heatSoundCooldown=0;
function updateHeat(dt){
  if(level!==2 && level!==3 && level!==5){
    heatEl.style.opacity=0;heatState=0;dmgEl.style.opacity=0;return;
  }
  let inHeat=false;
  for(const hz of heatZones){
    const d=Math.hypot(player.pos.x-hz.x, player.pos.z-hz.z);
    if(d<hz.r){inHeat=true;break;}
  }
  const target=inHeat?1:0;
  heatState+=(target-heatState)*Math.min(1, dt*2);
  heatEl.style.opacity=(heatState*(level===3?0.95:0.85)).toFixed(3);
  if(inHeat){
    damageAccum+=dt*(level===3?10:(level===5?8:6));
    dmgEl.style.opacity=Math.min(0.45, damageAccum*0.06).toFixed(3);
    const threshold=level===3?130:100;
    if(damageAccum>threshold){
      damageAccum=0;
      if(level===3){
        toast('ПЕРЕГРЕВ...', 1400);
        if(actx && !muted) playSteam();
        setTimeout(()=>{buildLevel(3, true);}, 500);
      } else if(level===2){
        toast('УРОВЕНЬ 2.1...', 1400);
        if(actx && !muted) playSteam();
        setTimeout(()=>{buildLevel(2, true);}, 500);
      } else {
        toast('КОТЕЛЬНАЯ...', 1400);
        damageAccum=0;
      }
    }
    heatSoundCooldown-=dt;
    if(heatSoundCooldown<=0){heatSoundCooldown=1.5+Math.random()*2;playSteam();}
  } else {
    damageAccum=Math.max(0, damageAccum-dt*2);
    dmgEl.style.opacity=Math.min(0.45, damageAccum*0.06).toFixed(3);
  }
}

/* ============ ГЕНЕРАТОРЫ ============ */
function updateGenerators(dt){
  if(level!==3) return;
  const t=performance.now()*0.005;
  for(const g of generatorLights){
    const pulse=0.85+Math.sin(t + g.base)*0.15;
    g.light.intensity=g.base*pulse;
    if(g.core) g.core.scale.setScalar(0.9+Math.sin(t*2+g.base)*0.15);
  }
  explosionCooldown-=dt;
  if(explosionCooldown<=0){
    explosionCooldown=25+Math.random()*30;
    if(genRooms.length){
      const gr=genRooms[(Math.random()*genRooms.length)|0];
      const gx=gr.cx*CELL, gz=gr.cy*CELL;
      const d=Math.hypot(player.pos.x-gx, player.pos.z-gz);
      if(d<20){
        playExplosion();
        const flash=new THREE.PointLight(0xffb060, 80, 30, 1.5);
        flash.position.set(gx, 2, gz);levelGroup.add(flash);
        setTimeout(()=>{levelGroup.remove(flash);}, 300);
        if(d<6){
          dmgEl.style.opacity='0.8';
          setTimeout(()=>{dmgEl.style.opacity='0';}, 400);
          if(d<2.5){ die(); return; }
        }
        toast('ВЗРЫВ ГЕНЕРАТОРА', 1500);
      }
    }
  }
}

/* ============ МИНДАЛЬНАЯ ВОДА ============ */
function updateAlmonds(dt){
  if(level!==3 && level!==4 && level!==5) return;
  for(let i=almondPickups.length-1;i>=0;i--){
    const a=almondPickups[i];
    a.life+=dt;
    if(a.isFountain){
      a.mesh.rotation.y+=dt*0.3;
    } else {
      a.mesh.rotation.y+=dt*1.5;
      a.mesh.position.y=0.05+Math.sin(a.life*2)*0.05;
    }
    const d=Math.hypot(player.pos.x-a.x, player.pos.z-a.z);
    if(d<1.0){
      if(levelGroup) levelGroup.remove(a.mesh);
      almondPickups.splice(i,1);
      damageAccum=Math.max(0, damageAccum-30);
      if(actx && !muted){
        const t=actx.currentTime;
        const o=actx.createOscillator();o.type='sine';
        o.frequency.setValueAtTime(600, t);
        o.frequency.exponentialRampToValueAtTime(900, t+0.2);
        const g=actx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.1, t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
        o.connect(g);g.connect(masterGain);
        o.start(t);o.stop(t+0.35);
      }
      toast('МИНДАЛЬНАЯ ВОДА +', 1000);
    }
  }
}

/* ============ ОКНА ============ */
function updateWindows(dt){
  if(level!==4) return;
  trapCooldown-=dt;
  for(const w of windows){
    if(w.dark) continue;
    const toWin=new THREE.Vector3().subVectors(w.mesh.position, camera.position);
    const dist=toWin.length();
    if(dist>10) continue;
    toWin.normalize();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    const dot=toWin.dot(fwd);
    if(dot>0.85 && trapCooldown<=0){
      trapCooldown=8+Math.random()*6;
      trapEl.style.opacity='0.95';
      setTimeout(()=>{trapEl.style.opacity='0';}, 350);
      playBeep(180, 0.5);
      toast('ОКНО-ЛОВУШКА', 1400);
      if(Math.random()<0.5){
        const cell=findOpenCell();
        if(cell){
          spawnEntity('hound', new THREE.Vector3(cell.x*CELL, 0, cell.y*CELL));
          playHoundGrowl();
        }
      }
      damageAccum+=20;
      break;
    }
  }
}

/* ============ ТОРГОВЫЕ АВТОМАТЫ ============ */
function updateVendings(dt){
  if(level!==4) return;
  for(const v of vendings){
    v.life+=dt;
    const d=Math.hypot(player.pos.x-v.x, player.pos.z-v.z);
    if(d<1.0 && !v.used){
      v.used=true;
      playBeep(880, 0.15);
      setTimeout(()=>playBeep(1200, 0.15), 120);
      damageAccum=Math.max(0, damageAccum-25);
      toast('МИНДАЛЬНАЯ ВОДА +', 900);
      const origMat=v.mesh.material;
      v.mesh.material=M.pcScreen;
      setTimeout(()=>{v.mesh.material=origMat;}, 400);
    }
  }
}

/* ============ УРОВЕНЬ 5: ОБНОВЛЕНИЯ ============ */
function updateHotelAmbience(dt){
  if(level!==5) return;
  jazzCooldown-=dt;
  if(jazzCooldown<=0){
    jazzCooldown=3.5+Math.random()*2.5;
    if(jazzActive && Math.random()<0.75) playJazzChord();
  }
  whisperCooldown-=dt;
  if(whisperCooldown<=0){
    whisperCooldown=7+Math.random()*10;
    if(Math.random()<0.7) playWhisper();
  }
  for(const p of watchingPaintings){
    p.mesh.rotation.z=Math.sin(performance.now()*0.001 + p.mesh.position.x*0.01)*0.02;
  }
  for(const c of chandeliers){
    c.light.intensity=c.base*(0.92+Math.sin(performance.now()*0.002+c.base)*0.08);
  }
}
function updateElevators(dt){
  if(level!==5) return;
  elevatorCooldown-=dt;
  for(const e of elevators){
    const d=Math.hypot(player.pos.x-e.x, player.pos.z-e.z);
    e.light.intensity=5+Math.sin(performance.now()*0.003 + e.x)*2;
    if(d<1.2 && elevatorCooldown<=0){
      elevatorCooldown=15+Math.random()*10;
      toast('ЛИФТ ОТКРЫВАЕТСЯ...', 1400);
      if(Math.random()<0.5){
        if(actx && !muted) playBeep(220, 0.4);
        setTimeout(()=>{
          const cell=findOpenCell();
          if(cell) player.pos.set(cell.x*CELL, 0, cell.y*CELL);
          toast('ЭТАЖ 7', 1500);
        }, 800);
      } else {
        if(actx && !muted) playExplosion();
        damageAccum+=60;
        dmgEl.style.opacity='0.7';
        setTimeout(()=>{dmgEl.style.opacity='0';}, 500);
        toast('ЭТАЖ 13... НЕ НАДО БЫЛО', 1800);
      }
    }
  }
}

/* ============ ГАЛЛЮЦИНАЦИИ-СПАВНЕР ============ */
let halluCooldown=6,speakCooldown=12,buzzCooldown=10,humSwellCooldown=20;
function updateHallucinationSpawner(dt){
  const intensity=level===0?1:0.1;
  halluCooldown-=dt;
  if(halluCooldown<=0){
    const co2Boost=Math.min(2.5, co2*6);
    halluCooldown=(5+Math.random()*7)/(intensity*(1+co2Boost*0.3));
    const r=Math.random();
    if(r<0.35) spawnHallucination('door');
    else if(r<0.65) spawnHallucination('stairs');
    else spawnHallucination('shadow');
  }
  speakCooldown-=dt;
  if(speakCooldown<=0 && intensity>0.5){
    speakCooldown=14+Math.random()*20;
    if(Math.random()<0.7) playSpeak();
  }
  buzzCooldown-=dt;
  if(buzzCooldown<=0 && intensity>0.5){
    buzzCooldown=12+Math.random()*18;
    if(Math.random()<0.6) playBuzz(1+Math.random()*2);
  }
  humSwellCooldown-=dt;
  if(humSwellCooldown<=0 && intensity>0.5){
    humSwellCooldown=25+Math.random()*35;
    if(Math.random()<0.5) playHumSwell();
  }
}

/* ============ МЕТРЫ ============ */
function updateMeter(dt){
  if(level===0){
    mLabel.textContent='CO₂';
    co2+=CO2_RATE*dt;
    mVal.textContent=co2.toFixed(3)+'%';
    mFill.style.width=Math.min(100, (co2/0.5)*100)+'%';
    const t=Math.max(0, (co2-0.15)/0.35);
    tintEl.style.opacity=Math.min(0.55, t*0.55);
  } else if(level===1){
    mLabel.textContent='ОПАСНОСТЬ';
    let best=999;
    for(const e of entities){
      const d=Math.hypot(e.pos.x-player.pos.x, e.pos.z-player.pos.z);
      if(d<best) best=d;
    }
    const danger=best<3?1:Math.max(0, 1-best/22);
    mVal.textContent=danger>0.6?'ВЫСОКАЯ':danger>0.3?'СРЕДНЯЯ':'НИЗКАЯ';
    mFill.style.width=(danger*100)+'%';tintEl.style.opacity=0;
  } else if(level===2){
    mLabel.textContent='ТЕМПЕРАТУРА';
    const temp=22+heatState*24;
    mVal.textContent=temp.toFixed(0)+'°C';
    mFill.style.width=Math.min(100, ((temp-20)/30)*100)+'%';tintEl.style.opacity=0;
  } else if(level===3){
    mLabel.textContent='ТЕМПЕРАТУРА';
    const temp=25+heatState*32;
    mVal.textContent=temp.toFixed(0)+'°C';
    mFill.style.width=Math.min(100, ((temp-20)/40)*100)+'%';tintEl.style.opacity=0;
  } else if(level===4){
    mLabel.textContent='МИНДАЛЬ';
    mVal.textContent=almondPickups.length+' фонтанов';
    mFill.style.width=Math.min(100, (almondPickups.length/4)*100)+'%';
    tintEl.style.opacity=0;
  } else {
    mLabel.textContent='ЭТАЖ';
    mVal.textContent='1 / 12';
    mFill.style.width='8%';
    tintEl.style.opacity=0;
  }
}

/* ============ UI ============ */
let toastTimer=null;
function toast(text, ms=1500){
  toastEl.textContent=text;
  toastEl.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toastEl.style.opacity=0;}, ms);
}
function showHint(text){
  if(text){hintEl.textContent=text;hintEl.classList.add('on');}
  else hintEl.classList.remove('on');
}
function hideOverlay(){overlay.classList.add('hidden');}

function showMenu(){
  overlay.innerHTML=`
    <h1>ЗАКУЛИСЬЕ</h1>
    <div class="sub">УРОВЕНЬ 0 → 1 → 2 → 3 → 4 → 5 → ...</div>
    <p>Шесть уровней. Каждый — глубже и опаснее предыдущего.</p>
    <div class="doc">
      <b>Ур.0</b> — жёлтые комнаты. Галлюцинации, CO₂, меняющееся пространство. Без сущностей.<br>
      <b>Ур.1</b> — склад, туман, ящики, блэкауты. Безликие, Гончие.<br>
      <b>Ур.2</b> — серые тоннели, трубы, вентиляция. Улыбающиеся, Кожекрады.<br>
      <b>Ур.3</b> — кирпич, медные трубы, решётки, генераторы. Горящие, Крадущиеся.<br>
      <b>Ур.4</b> — пустое офисное здание. Окна-ловушки, Миндальная Вода. Только Гончие и Серости.<br>
      <b>Ур.5</b> — бесконечный отель 1920-х. Джаз, люстры, Смертомоли, лифты (не выше 12),
      Котельная с трубами Миндальной Воды. Базы: Домоводы, Уютный Отель, Первенцы, Общество.
    </div>
    <div class="keys">WASD — движение · SHIFT — бег · МЫШЬ — обзор · M — звук</div>
    <div class="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ</div>`;
  overlay.classList.remove('hidden');
}
function showPause(){
  overlay.innerHTML=`
    <h2>ПАУЗА</h2>
    <p>${level===0?'Гул продолжается, даже когда ты не двигаешься.'
       : level===1?'Туман не рассеивается.'
       : level===2?'В тоннелях что-то шевелится.'
       : level===3?'Генераторы ревут. Не подходи слишком близко.'
       : level===4?'Не смотри в светлые окна.'
       : 'Джаз играет. Никто не танцует.'}</p>
    <div class="hint">НАЖМИ, ЧТОБЫ ПРОДОЛЖИТЬ</div>`;
  overlay.classList.remove('hidden');
}
function showDeath(){
  overlay.innerHTML=`
    <h1 style="color:#e07a6a;text-shadow:0 0 40px rgba(220,90,70,.5)">ВАС НАШЛИ</h1>
    <p>Ты дошёл до уровня <b>${level}</b> и продержался <b>${fmtTime(totalTime)}</b>.</p>
    <p style="color:#7d734f;font-size:13px">Отель продолжает играть джаз. Для кого-то другого.</p>
    <div class="hint">НАЖМИ, ЧТОБЫ НАЧАТЬ ЗАНОВО</div>`;
  overlay.classList.remove('hidden');
}
function fmtTime(sec){
  const m=Math.floor(sec/60),s=Math.floor(sec%60);
  return m+':'+String(s).padStart(2,'0');
}

/* ============ ПЕРЕХОДЫ ============ */
function nextLevel(){
  level++;
  totalTime+=(performance.now()-levelStartTime)/1000;
  levelStartTime=performance.now();
  hLevel.textContent=level;
  co2=0.04;damageAccum=0;
  clearHallucinations();clearEntities();clearCrates();clearDrawings();
  buildLevel(level);
  if(level===0) toast('УРОВЕНЬ 0', 1800);
  else if(level===1){toast('УРОВЕНЬ 1', 1800);setTimeout(()=>toast('СКЛАД. ДЕРЖИСЬ СВЕТА.', 2200), 1900);}
  else if(level===2){toast('УРОВЕНЬ 2', 1800);setTimeout(()=>toast('ТОННЕЛИ. БЕГИ.', 2200), 1900);}
  else if(level===3){toast('УРОВЕНЬ 3', 1800);setTimeout(()=>toast('КИРПИЧ. ГЕНЕРАТОРЫ. НЕ ПОДХОДИ.', 2400), 1900);}
  else if(level===4){toast('УРОВЕНЬ 4', 1800);setTimeout(()=>toast('ОФИС. ЗАПАСАЙСЯ ВОДОЙ.', 2400), 1900);}
  else if(level===5){toast('УРОВЕНЬ 5', 1800);setTimeout(()=>toast('ОТЕЛЬ. НЕ ХОДИ НА 13-Й.', 2400), 1900);}
  else toast('УРОВЕНЬ '+level, 1800);
}
function die(){
  state='dead';deaths++;hDeaths.textContent=deaths;
  clearHallucinations();clearEntities();
  if(document.pointerLockElement) document.exitPointerLock();
  showDeath();
}
function startGame(){
  level=0;deaths=0;totalTime=0;co2=0.04;damageAccum=0;
  distanceTraveled=0;mutateAccum=0;
  hLevel.textContent='0';hDeaths.textContent='0';
  clearHallucinations();clearEntities();clearCrates();clearDrawings();
  buildLevel(0);
  levelStartTime=performance.now();
  beginPlay();
}
function beginPlay(){
  initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  hideOverlay();
  state='playing';
  lastTime=performance.now();
  levelStartTime=performance.now();
  try{canvas.requestPointerLock();}catch(e){}
}

/* ============ ВВОД ============ */
addEventListener('keydown', e=>{
  if(e.code==='KeyW') keys.w=true;
  if(e.code==='KeyA') keys.a=true;
  if(e.code==='KeyS') keys.s=true;
  if(e.code==='KeyD') keys.d=true;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') keys.shift=true;
  if(e.code==='KeyM') toggleMute();
});
addEventListener('keyup', e=>{
  if(e.code==='KeyW') keys.w=false;
  if(e.code==='KeyA') keys.a=false;
  if(e.code==='KeyS') keys.s=false;
  if(e.code==='KeyD') keys.d=false;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') keys.shift=false;
});
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement!==canvas) return;
  yaw-=e.movementX*0.0022;
  pitch-=e.movementY*0.0022;
  pitch=Math.max(-1.45, Math.min(1.45, pitch));
});
document.addEventListener('pointerlockchange', ()=>{
  if(document.pointerLockElement===canvas){
    if(state==='paused'){state='playing';hideOverlay();}
  } else {
    if(state==='playing'){
      state='paused';
      keys.w=keys.a=keys.s=keys.d=keys.shift=false;
      showPause();
    }
  }
});
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
overlay.addEventListener('click', ()=>{
  if(state==='menu') startGame();
  else if(state==='paused') beginPlay();
  else if(state==='dead') startGame();
});

/* ============ ГЛАВНЫЙ ЦИКЛ ============ */
let lastTime=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05, (now-lastTime)/1000);
  lastTime=now;

  if(state==='playing'){
    updatePlayer(dt);
    updateHallucinationSpawner(dt);
    updateHallucinations(dt);
    updateEntities(dt);
    updateCrates(dt);
    updateDrawings(dt);
    updateLamps(dt);
    updateBlackout(dt);
    updateHeat(dt);
    updateGenerators(dt);
    updateAlmonds(dt);
    updateWindows(dt);
    updateVendings(dt);
    updateHotelAmbience(dt);
    updateElevators(dt);
    updateMeter(dt);

    let hint=null;
    for(const s of safeZones){
      if(Math.hypot(player.pos.x-s.x, player.pos.z-s.z)<s.r-1){hint=s.name;break;}
    }
    showHint(hint);

    const d=Math.hypot(player.pos.x-exitPos.x, player.pos.z-exitPos.z);
    if(d<1.7) nextLevel();

    const t=totalTime+(performance.now()-levelStartTime)/1000;
    hTime.textContent=fmtTime(t);
  } else {
    if(state!=='dead'){
      yaw+=dt*0.08;
      camera.position.set(player.pos.x, player.pos.y+player.eye, player.pos.z);
      camera.rotation.set(0, yaw, 0);
    }
    updateLamps(dt);
    updateHallucinations(dt);
    updateCrates(dt);
  }

  if(exitMesh){
    const s=1+Math.sin(performance.now()*0.0035)*0.06;
    exitMesh.scale.set(s,s,1);
    exitMesh.material.opacity=0.7+Math.sin(performance.now()*0.005)*0.2;
  }
  if(exitLight){
    exitLight.intensity=12+Math.sin(performance.now()*0.004)*4;
  }

  renderer.render(scene, camera);
}

/* ============ СТАРТ ============ */
buildLevel(0);
showMenu();
loop();
</script>
</body>
</html>
